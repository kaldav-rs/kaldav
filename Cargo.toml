[workspace]
members = [".", "derive"]

[workspace.package]
authors = ["Sanpi <sanpi@homecomputing.fr>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kaldav-rs/kaldav"
version = "0.8.0"

[package]
name = "kaldav"
description = "Caldav client"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
ikal = "0.6"
jiff = "1.0"
sxd-document = "0.3"
sxd-xpath = "0.4"
thiserror = "2.0"
url = "2.0"
webdav = "0.1"

[dependencies.kaldav-derive]
version = "0.8"
path = "derive"

[dependencies.attohttpc]
version = "0.32"
default-features = false
features = ["basic-auth", "compress"]

[dependencies.uuid]
version = "1.18"
features = ["v7"]

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
httpmock = "0.9"

[dev-dependencies.clap]
version = "4.0"
features = ["derive"]

[features]
default = ["native-tls"]
native-tls = ["attohttpc/native-tls"]
rustls = ["attohttpc/tls-rustls"]
